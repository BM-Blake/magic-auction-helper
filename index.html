<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101218">
    <meta name="description" content="Offline Magic Auction tracker for Magic Chess: Go Go. Log revealed treasures and total their worth.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Magic Auction Helper</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css?v=42">
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="title-row">
          <label class="house-label">
            <span class="visually-hidden">Auction house</span>
            <select id="house" class="house"></select>
          </label>
          <button type="button" id="end-game" class="ghost">End game</button>
        </div>
        <p id="network" class="status" hidden></p>
        <section class="worth" aria-live="polite">
          <p class="worth-label">Estimate worth</p>
          <p id="worth-range" class="worth-range">0</p>
        </section>
      </header>

      <main>
        <p id="load-error" class="card error" hidden></p>

        <section class="card" aria-labelledby="info-heading">
          <h2 id="info-heading">Available information</h2>

          <div class="exact">
            <p class="worth-label">Total treasures</p>
            <p id="treasure-total" class="exact-total">0</p>
          </div>

          <div class="exact">
            <p class="worth-label">Exact price</p>
            <p id="exact-total" class="exact-total">0</p>
          </div>

          <p id="info-empty" class="empty">Nothing revealed yet.</p>

          <fieldset id="rarity-group" hidden>
            <legend>Rarity</legend>
            <div id="rarities" class="chips" role="group" aria-label="Revealed rarities"></div>
          </fieldset>

          <fieldset id="type-group" hidden>
            <legend>Type</legend>
            <div id="types" class="chips" role="group" aria-label="Revealed types"></div>
          </fieldset>

          <fieldset id="size-group" hidden>
            <legend>Size</legend>
            <div id="sizes" class="chips" role="group" aria-label="Revealed sizes"></div>
          </fieldset>

          <div id="detail" class="detail" hidden>
            <h3 id="detail-title"></h3>
            <p id="detail-empty" class="empty" hidden>None listed yet.</p>
            <ul id="detail-list" class="detail-list"></ul>
          </div>
        </section>
      </main>
    </div>

    <button type="button" id="fab" class="fab" aria-label="Add information">+</button>
    <form id="sheet" class="sheet" hidden>
      <div class="sheet-top">
        <div class="form-head">
          <h2>Add information</h2>
          <button type="button" id="close-sheet" class="text-btn">Close</button>
        </div>
        <p class="hint">Each count adds that many treasures.</p>
      </div>
      <div id="groups"></div>
      <button type="button" id="add-group" class="add-another">Add another</button>
      <p id="form-error" class="form-error" role="alert" hidden></p>
      <button type="submit" class="primary">Add</button>
    </form>
    <script src="app.js?v=42"></script>
  </body>
</html>
