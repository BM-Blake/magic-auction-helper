plugins {
    id "com.android.application"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace "com.bmblake.magicauction"
    compileSdk 36

    defaultConfig {
        applicationId "com.bmblake.magicauction"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties.getProperty("storeFile"))
                storePassword keystoreProperties.getProperty("storePassword")
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

tasks.register("syncWebAssets", Copy) {
    def webRoot = rootProject.file("..")
    from(webRoot) {
        include "index.html"
        include "styles.css"
        include "app.js"
        include "icon.png"
        include "manifest.webmanifest"
        include "data/auction.json"
        include "data/treasures.json"
    }
    into layout.projectDirectory.dir("src/main/assets")
    doFirst {
        delete layout.projectDirectory.file("src/main/assets/sw.js")
    }
}

tasks.named("preBuild").configure { dependsOn("syncWebAssets") }

dependencies {
    implementation "androidx.webkit:webkit:1.18.0"
}
